name: BDD Tests

# The UI suite drives Stord's live production site, so it is NOT triggered on every push or PR.
# It runs on a weekday schedule and on demand.
on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag expression'
        default: '@Smoke'

permissions:
  contents: read

# Never run two suites against the live site at once
concurrency:
  group: bdd-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Optional dashboard publishing: both must exist, otherwise the publish step is skipped
      DASHBOARD_REPO: ${{ vars.DASHBOARD_REPO }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      SUITE: ${{ github.event.inputs.tags || '@Smoke' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The tests step never fails the job by itself: results are always built, published and uploaded first, and the
      # "Release gate" step at the end makes the call (smoke tests, High-priority requirements, pass rate). A failing
      # Medium-priority test still shows up as a warning, in the job summary and on the dashboard.
      - name: Run tests
        id: tests
        continue-on-error: true
        run: npx cucumber-js --tags "${{ github.event.inputs.tags || '@Smoke' }}"
        env:
          SLACK_NOTIFY: ${{ secrets.SLACK_WEBHOOK_FAILURES != '' }}
          SLACK_WEBHOOK_FAILURES: ${{ secrets.SLACK_WEBHOOK_FAILURES }}
          SLACK_WEBHOOK_REGRESSION: ${{ secrets.SLACK_WEBHOOK_REGRESSION }}
      # Traceability matrix (uploaded below). Fails the step if a requirement has a failing scenario.
      - name: Build requirements traceability matrix
        if: always()
        run: npm run rtm
      # Allure needs Java, which the ubuntu runner already has. The dashboard repo's previous report is
      # checked out first so its history/ folder carries over and Allure can draw its own trend graphs.
      - name: Check out the dashboard repo
        if: always() && env.DASHBOARD_REPO != '' && env.DASHBOARD_TOKEN != ''
        run: git clone --depth 1 "https://x-access-token:${DASHBOARD_TOKEN}@github.com/${DASHBOARD_REPO}.git" dashboard
      - name: Generate Allure report
        if: always()
        run: |
          if [ -d dashboard/allure/history ]; then cp -r dashboard/allure/history allure-results/history; fi
          npx allure generate allure-results --clean -o allure-report
      # Push this run's results (and the full Allure report) into the dashboard repo; Vercel redeploys from there.
      # (No "[skip ci]" in the message: Vercel would skip the deploy too.)
      - name: Publish results to the dashboard repo
        if: always() && env.DASHBOARD_REPO != '' && env.DASHBOARD_TOKEN != ''
        run: |
          ALLURE_FLAG=""
          if [ -f allure-report/index.html ]; then
            rm -rf dashboard/allure && cp -r allure-report dashboard/allure
            ALLURE_FLAG="--allure"
          fi
          node scripts/export-dashboard-data.js --out dashboard/data --suite "${SUITE}" ${ALLURE_FLAG}
          cd dashboard
          git config user.name "stord-qa-bot"
          git config user.email "stord-qa-bot@users.noreply.github.com"
          git add data
          if [ -d allure ]; then git add allure; fi
          git commit -m "Results for run ${GITHUB_RUN_NUMBER} (${SUITE})" || { echo "No changes to publish"; exit 0; }
          # Another writer (a manual run, a README edit) can move main between our pull and push: retry instead of losing the run
          for attempt in 1 2 3; do
            git pull --rebase origin HEAD && git push && exit 0
            echo "Push failed (attempt $attempt), retrying"; sleep $((attempt * 5))
          done
          echo "Could not publish results to the dashboard repo" >&2
          exit 1
      - name: Release gate
        if: always()
        run: npm run gate -- ${{ contains(env.SUITE, '@Complete') && '--require-coverage' || '' }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            test-results/
            allure-report/
